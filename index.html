<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINYL</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1 class="logo">
            VINYL
        </h1>

        <nav class="menu">
            <ul class="menu-list">
                <li><a href="#">Home</a></li>
                <li><a href="#">Albums</a></li>
                <li><a href="#">Library</a></li>
                <li><a href="#">Playlist</a></li>
            </ul>
        </nav>
    </header>


    <main class="main-content">

        <section class="now-playing-section">
            <img src="assets\img\oasis-wonderwall-cover.jpg" alt="Oasis - Wonderwall" class="album-cover">
            
            <h2 class="section-title">NOW PLAYING</h2>
            <h3 class="song-title">Oasis - Wonderwall</h3>

            <audio controls src="assets\audio\oasis-wonderwall.mp3" class="audio-player"></audio>

            <input type="range" class="progress-bar" value="0" min="0" max="100" step="0.1">
            <input type="range" class="volume-bar" value="1" min="0" max="1" step="0.01">

            <button class="prev-button">Prev</button>
            <button class="play-button">Play</button>
            <button class="next-button">Next</button>
        </section>

        <section class="vinyl-content">
        
            <div class="turntable">
        
                <div class="turntable-base"></div>
        
                <div class="vinyl-record">
                    <div class="vinyl">
                        <div class="record-label"></div>
                        <div class="center-hole"></div>
                    </div>
                </div>
        
                <div class="turntable-arm">
                    <div class="turntable-needle"></div>
                </div>
        
            </div>
        
        </section>

    </main>
</body>
<script src="js/app.js"></script>
</html>
